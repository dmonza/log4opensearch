name: log4opensearch

services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    restart: unless-stopped
    environment:
      - node.name=opensearch
      - cluster.name=log4opensearch-cluster
      - discovery.type=single-node
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP} -Xmx${OPENSEARCH_HEAP}
      # DEV-FIRST: security plugin disabled on purpose. See README > Security.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # One-shot: installs the index template and the ISM retention policy.
  provisioning:
    image: curlimages/curl:8.11.1
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS}
    volumes:
      - ./provisioning:/provisioning:ro
    entrypoint: ["sh", "/provisioning/bootstrap.sh"]
    restart: on-failure

  logstash:
    build:
      context: ./logstash
      args:
        LOGSTASH_VERSION: ${LOGSTASH_VERSION}
    image: log4opensearch/logstash:${LOGSTASH_VERSION}
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
      provisioning:
        condition: service_completed_successfully
    environment:
      - LS_JAVA_OPTS=-Xms${LOGSTASH_HEAP} -Xmx${LOGSTASH_HEAP}
      - OPENSEARCH_URL=http://opensearch:9200
      # Logstash 8 defaults every plugin to ECS mode, which turns `host` into an object and
      # collides with the flat mapping in provisioning/index-template.json. The pipeline sets
      # ecs_compatibility => "disabled" on each plugin, but this makes it the pipeline-wide
      # default too: a plugin added later without that setting cannot silently poison the
      # mapping. The image's entrypoint maps this env var into logstash.yml (via env2yaml).
      - PIPELINE_ECS_COMPATIBILITY=disabled
    ports:
      - "${LOG_UDP_PORT}:5960/udp"
    healthcheck:
      # The API on :9600 answers well before the pipeline is up, so it alone would report
      # healthy while the UDP listener is not bound yet — and UDP being fire-and-forget,
      # every log line sent in that window is lost silently. Also require the socket to be
      # bound: 1748 is 5960 in hex, as /proc/net/udp spells it.
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/_node/stats >/dev/null && grep -q ':1748' /proc/net/udp"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  dashboards:
    build:
      context: ./opensearch_dashboards
      args:
        DASHBOARDS_VERSION: ${DASHBOARDS_VERSION}
    image: log4opensearch/dashboards:${DASHBOARDS_VERSION}
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "${DASHBOARDS_PORT}:5601"

  # --- OpenTelemetry (OTLP) ingestion — opt-in via `docker compose --profile otel up` ---
  # These two services carry the `otel` profile, so a plain `docker compose up` never starts
  # them: the default stack is byte-for-byte unchanged.

  # One-shot: installs the OTLP index templates (mappings only). The retention ISM that
  # governs these indices is installed by the always-on `provisioning` service, whose policy
  # is extended to cover the OTLP span and log patterns — hence the depends_on below.
  provisioning-otel:
    image: curlimages/curl:8.11.1
    profiles: ["otel"]
    depends_on:
      opensearch:
        condition: service_healthy
      provisioning:
        condition: service_completed_successfully
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
    volumes:
      - ./provisioning:/provisioning:ro
    entrypoint: ["sh", "/provisioning/bootstrap-otel.sh"]
    restart: on-failure

  # The OTLP receiver: terminates OTLP/gRPC and writes traces and logs to OpenSearch.
  # index_type: management_disabled in the pipelines means it creates no template or ISM of
  # its own — the stack owns those (provisioning/otel-*-template.json + the retention ISM).
  data-prepper:
    image: opensearchproject/data-prepper:${DATAPREPPER_VERSION}
    profiles: ["otel"]
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
      provisioning-otel:
        condition: service_completed_successfully
    environment:
      # The image sets JAVA_OPTS internally and overrides it; DATA_PREPPER_JAVA_OPTS is the
      # user-facing heap override.
      - DATA_PREPPER_JAVA_OPTS=-Xms${DATAPREPPER_HEAP} -Xmx${DATAPREPPER_HEAP}
    volumes:
      - ./data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    ports:
      # Both are OTLP/gRPC. 21890 = traces source, 21892 = logs source (container side).
      - "${OTLP_TRACES_PORT}:21890"
      - "${OTLP_LOGS_PORT}:21892"
    healthcheck:
      # The core API on :4900 has no /health; the trace source exposes one over HTTP on its
      # gRPC port (health_check_service + unframed_requests + ssl:false in pipelines.yaml).
      # Requiring it bound before "up" is the same lesson the Logstash UDP healthcheck learned.
      test: ["CMD-SHELL", "curl -fs http://localhost:21890/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  opensearch-data:
