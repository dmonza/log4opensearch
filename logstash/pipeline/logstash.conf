input {
  udp {
    port  => 5960
    type  => "log4net"

    # Flat schema (host, message) instead of ECS (host.ip, event.original): the index
    # template in provisioning/index-template.json maps the flat fields. The codec
    # needs its own setting — otherwise it defaults to ECS and copies the whole raw
    # line into event.original, duplicating every payload on disk.
    ecs_compatibility => "disabled"
    codec => plain {
      charset           => "UTF-8"
      ecs_compatibility => "disabled"
    }
  }
}

filter {
  if [type] == "log4net" {

    # IMPORTANT: grok stops at the FIRST matching pattern (break_on_match => true).
    # Patterns MUST be ordered from most specific to most generic, otherwise a
    # generic pattern swallows the specific ones and their fields are never extracted.
    grok {
      ecs_compatibility => "disabled"

      # 1) Structured / traced format (most specific)
      # 2021-09-08 20:13:11,709-03:00 [1] INFO  - XTOP - CONSOLE - APP - [abc-123] [10.0.0.1] [MyProgram] [42] payload
      match => { "message" => "(?m)%{TIMESTAMP_ISO8601:localTimestamp} \[%{DATA:threadid}\] %{LOGLEVEL:loglevel} +- %{IPORHOST:tempHost} - %{HOSTNAME:env} - %{HOSTNAME:tag} - \[%{DATA:traceId}\] \[%{IPORHOST:source_ip}\] \[%{DATA:program_name}\] \[%{IPORHOST:entityId}\] \[%{IPORHOST:entityName}\] %{GREEDYDATA:tempMessage}" }
      match => { "message" => "(?m)%{TIMESTAMP_ISO8601:localTimestamp} \[%{DATA:threadid}\] %{LOGLEVEL:loglevel} +- %{IPORHOST:tempHost} - %{HOSTNAME:env} - %{HOSTNAME:tag} - \[%{DATA:traceId}\] \[%{IPORHOST:source_ip}\] \[%{DATA:program_name}\] \[%{IPORHOST:entityId}\] %{GREEDYDATA:tempMessage}" }

      # 2) Program + tag format
      # 2021-09-08 20:13:11,709-03:00 [1] WARN  - XTOP - CONSOLE - ATestCmd - notag - Hola mundo
      match => { "message" => "(?m)%{TIMESTAMP_ISO8601:localTimestamp} \[%{DATA:threadid}\] %{LOGLEVEL:loglevel} +- %{IPORHOST:tempHost} - %{HOSTNAME:env} - %{DATA:program} - %{DATA:tag} - %{GREEDYDATA:tempMessage}" }

      # 3) Bare format (most generic — keep last)
      # 2021-09-08 19:22:56,016-03:00 [36] DEBUG - XTOP - CONSOLE - Begin Web Client Registration
      match => { "message" => "(?m)%{TIMESTAMP_ISO8601:localTimestamp} \[%{DATA:threadid}\] %{LOGLEVEL:loglevel} +- %{IPORHOST:tempHost} - %{HOSTNAME:env} - %{GREEDYDATA:tempMessage}" }

      tag_on_failure => ["_grokparsefailure_log4net"]
    }

    if !("_grokparsefailure_log4net" in [tags]) {
      date {
        match  => ["localTimestamp", "yyyy-MM-dd HH:mm:ss,SSSZZ"]
        target => "@timestamp"
      }

      mutate {
        replace => { "message" => "%{tempMessage}" }
        replace => { "host"    => "%{tempHost}" }

        # Appender layouts end with %n, so every datagram arrives with a trailing newline
        # glued to the payload. strip runs after replace within a mutate, and only touches
        # the ends — the internal newlines of a stack trace survive.
        strip => ["message"]
      }

      mutate { remove_field => ["tempMessage", "tempHost", "localTimestamp"] }
    }
    # On grok failure the original `message` is kept intact and tagged, so nothing is
    # silently dropped — query for tags:_grokparsefailure_log4net in Dashboards.
  }
}

output {
  opensearch {
    hosts  => ["${OPENSEARCH_URL}"]
    index  => "logstash-%{+YYYY.MM.dd}"

    # The 'log4opensearch' index template is installed by provisioning/bootstrap.sh.
    # Left on, the plugin looks for its own bundled template (ecs-v8/3x.json), which
    # does not exist in the gem for OpenSearch 3.x, and logs an error on every start.
    manage_template   => false
    ecs_compatibility => "disabled"

    # DEV-FIRST: no auth / no TLS. For a secured cluster, see README > Security:
    # user     => "${OPENSEARCH_USER}"
    # password => "${OPENSEARCH_PASSWORD}"
    # ssl      => true
  }
}
