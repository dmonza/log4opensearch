version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /logstash
      - /opensearch_dashboards
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
