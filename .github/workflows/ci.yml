name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose file
        run: docker compose config -q

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.4.0
        with:
          recursive: true
          failure-threshold: warning

      - name: Lint shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh provisioning/*.sh

      - name: Check Python (dashboards import one-shot)
        run: python3 -m py_compile provisioning/import-dashboards.py

      - name: Assert no secrets in .env
        run: |
          if grep -Eiq '(password|secret|token|api_?key)[[:space:]]*=[[:space:]]*[^[:space:]]' .env; then
            echo "::error file=.env::.env is committed and must never contain credentials"
            exit 1
          fi

      - name: Validate JSON artifacts
        run: |
          python3 -m json.tool provisioning/index-template.json > /dev/null
          python3 -m json.tool provisioning/otel-span-template.json > /dev/null
          python3 -m json.tool provisioning/otel-service-map-template.json > /dev/null
          python3 -m json.tool provisioning/otel-logs-template.json > /dev/null
          sed 's/__RETENTION__/30/' provisioning/ism-policy.json | python3 -m json.tool > /dev/null

      - name: Validate Dashboards NDJSON artifacts
        # The saved-objects import API requires .ndjson (it rejects .json), so these are the sole
        # newline-delimited-JSON files in the stack — validate every line parses on its own.
        run: |
          for f in provisioning/dashboards/*.ndjson; do
            python3 -c "import json,sys;[json.loads(l) for l in open(sys.argv[1],encoding='utf-8') if l.strip()]" "$f"
            echo "ok $f"
          done

      - name: Validate Data Prepper YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('data-prepper/pipelines.yaml')); yaml.safe_load(open('data-prepper/data-prepper-config.yaml'))"

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Raise vm.max_map_count for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start the default stack
        # 420s: the default bring-up now also waits for the Dashboards healthcheck (cold start
        # ~90s) and the provisioning-dashboards one-shot to import the saved objects.
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: Assert the OTLP port is closed without the profile
        run: |
          if timeout 2 bash -c '</dev/tcp/127.0.0.1/4317' 2>/dev/null; then
            echo "::error::OTLP port 4317 is open without the otel profile — the default bring-up must not start the receiver"
            exit 1
          fi
          echo "OTLP port closed by default — ok"

      - name: Run UDP smoke test (default path)
        run: ./scripts/smoke-test.sh

      - name: Run Dashboards smoke test (default path)
        # Asserts the logstash-* index pattern + overview dashboard were auto-provisioned, so
        # Discover works with no manual step.
        run: ./scripts/dashboards-smoke-test.sh

      - name: Assert the saved-objects import is idempotent
        # Re-run the import one-shot: overwrite=true + stable ids means it exits 0 and the objects
        # are replaced in place, never duplicated. `compose wait` returns the one-shot's exit code.
        run: |
          docker compose up -d --force-recreate --no-deps provisioning-dashboards
          docker compose wait provisioning-dashboards
          ./scripts/dashboards-smoke-test.sh

      - name: Start the OTLP profile
        run: docker compose --profile otel up -d --build --wait --wait-timeout 360

      - name: Run OTLP smoke test
        run: ./scripts/otlp-smoke-test.sh

      - name: Run Dashboards smoke test (otel — asserts the otel-logs index pattern)
        run: ./scripts/dashboards-smoke-test.sh otel

      - name: Re-run UDP smoke test (existing path unaffected by the profile)
        run: ./scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile otel logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose --profile otel down -v
